<svg viewBox="0 0 160 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <!-- Aba de conexão no topo -->
  <rect x="58" y="4" width="44" height="26" rx="4" fill="#f5f5f7" stroke="#0b0b1f" stroke-width="3"/>

  <!-- Corpo do cartucho -->
  <rect x="20" y="20" width="120" height="168" rx="8" fill="#f5f5f7" stroke="#0b0b1f" stroke-width="3"/>

  <!-- Rótulo colorido -->
  <rect x="34" y="42" width="92" height="55" rx="4" fill="#ff206e" stroke="#0b0b1f" stroke-width="2"/>
  <rect x="34" y="83" width="92" height="14" fill="#00f5d4"/>

  <!-- Estrela decorativa no rótulo -->
  <circle cx="80" cy="62" r="10" fill="#ffd23f"/>

  <!-- Ranhuras de encaixe (grip) -->
  <g stroke="#0b0b1f" stroke-width="3" opacity="0.15">
    <line x1="38" y1="112" x2="38" y2="158"/>
    <line x1="50" y1="112" x2="50" y2="158"/>
    <line x1="62" y1="112" x2="62" y2="158"/>
    <line x1="74" y1="112" x2="74" y2="158"/>
    <line x1="86" y1="112" x2="86" y2="158"/>
    <line x1="98" y1="112" x2="98" y2="158"/>
    <line x1="110" y1="112" x2="110" y2="158"/>
    <line x1="122" y1="112" x2="122" y2="158"/>
  </g>

  <!-- Pinos de conexão na base -->
  <g fill="#0b0b1f">
    <rect x="34" y="180" width="6" height="10"/>
    <rect x="46" y="180" width="6" height="10"/>
    <rect x="58" y="180" width="6" height="10"/>
    <rect x="70" y="180" width="6" height="10"/>
    <rect x="82" y="180" width="6" height="10"/>
    <rect x="94" y="180" width="6" height="10"/>
    <rect x="106" y="180" width="6" height="10"/>
    <rect x="118" y="180" width="6" height="10"/>
  </g>
</svg>
