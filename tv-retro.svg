<svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <!-- Antena -->
  <line x1="100" y1="40" x2="70" y2="10" stroke="#0b0b1f" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="40" x2="130" y2="10" stroke="#0b0b1f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="70" cy="10" r="3.5" fill="#ff206e"/>
  <circle cx="130" cy="10" r="3.5" fill="#00f5d4"/>

  <!-- Corpo da TV -->
  <rect x="20" y="40" width="160" height="110" rx="16" fill="#f5f5f7" stroke="#0b0b1f" stroke-width="3"/>

  <!-- Moldura da tela -->
  <rect x="32" y="52" width="100" height="80" rx="10" fill="#0b0b1f"/>
  <!-- Tela -->
  <rect x="40" y="60" width="84" height="64" rx="6" fill="#14142b"/>

  <!-- Scanlines da tela -->
  <g opacity="0.18" stroke="#00f5d4" stroke-width="1.5">
    <line x1="40" y1="68" x2="124" y2="68"/>
    <line x1="40" y1="76" x2="124" y2="76"/>
    <line x1="40" y1="84" x2="124" y2="84"/>
    <line x1="40" y1="92" x2="124" y2="92"/>
    <line x1="40" y1="100" x2="124" y2="100"/>
    <line x1="40" y1="108" x2="124" y2="108"/>
    <line x1="40" y1="116" x2="124" y2="116"/>
  </g>

  <!-- Ícone de "play" na tela -->
  <polygon points="72,80 72,108 98,94" fill="#00f5d4"/>

  <!-- Botões / knobs -->
  <circle cx="152" cy="72" r="8" fill="#ffd23f" stroke="#0b0b1f" stroke-width="2"/>
  <circle cx="152" cy="98" r="6" fill="#ff206e" stroke="#0b0b1f" stroke-width="2"/>

  <!-- Alto-falante -->
  <line x1="144" y1="112" x2="144" y2="132" stroke="#0b0b1f" stroke-width="2"/>
  <line x1="152" y1="112" x2="152" y2="132" stroke="#0b0b1f" stroke-width="2"/>
  <line x1="160" y1="112" x2="160" y2="132" stroke="#0b0b1f" stroke-width="2"/>

  <!-- Pés / base -->
  <rect x="42" y="150" width="16" height="14" rx="2" fill="#0b0b1f"/>
  <rect x="142" y="150" width="16" height="14" rx="2" fill="#0b0b1f"/>
</svg>
